apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-abt
  labels:
    app: cv-abt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cv-abt
  template:
    metadata:
      labels:
        app: cv-abt
    spec:
      containers:
        - name: cv-abt
          image: ghcr.io/alibat1712/cv-abt:v1
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20