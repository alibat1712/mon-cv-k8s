---
- name: 'Installation de K3s sur mon serveur Ubuntu AWS'
  hosts: k3s_server
  become: yes
  
  tasks:
    - name: 'Desactivation de ufw comme pre-requis recommande'
      ansible.builtin.command: sudo ufw disable
    
    - name: 'Installer curl'
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true        
        
    - name: 'Installer et configurer k3s'
      ansible.builtin.shell: 
        cmd: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--tls-san {{ inventory_hostname }} --write-kubeconfig-mode 644" sh -
        creates: /usr/local/bin/k3s
       
    - name: 'Check du service k3s'
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: yes
        
    - name: 'Verification avec check des nodes k8s'
      ansible.builtin.command: kubectl get nodes
      register: result
       
    - name: 'Affichage du statut des nodes k8S'
      ansible.builtin.debug:
        var: result