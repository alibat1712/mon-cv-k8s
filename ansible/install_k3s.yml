---
- name: 'Installation de K3s sur mon serveur RHEL AWS'
  hosts: k3s_server
  become: yes
  
  tasks:
    #- name: 'Desactivation de ufw comme pre-requis recommande'
    #  ansible.builtin.command: sudo ufw disable
    
    - name: 'Installer curl'
      ansible.builtin.dnf:
        name: curl
        state: present       
        
    - name: 'Installer et configurer k3s'
      ansible.builtin.shell: 
        cmd: curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--tls-san {{ inventory_hostname }} --write-kubeconfig-mode 644" sh -
        creates: /etc/rancher/k3s/config.yaml
    
    - name: 'Mise a jour des permission du fichier /etc/rancher/k3s/config.yaml'
      ansible.builtin.command: sudo chmod 644 /etc/rancher/k3s/k3s.yaml
       
    - name: 'Check du service k3s'
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: yes
        
    - name: 'Verification avec check des nodes k8s'
      ansible.builtin.command: /usr/local/bin/kubectl get nodes
      register: result
       
    - name: 'Affichage du statut des nodes k8S'
      ansible.builtin.debug:
        var: result